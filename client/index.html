<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover enables env(safe-area-inset-*) on notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Tells the browser both schemes are supported before CSS loads -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)">
  <title>Factory Inventory Management System</title>
  <script>
    // Apply a saved theme before first paint so the page never flashes the
    // wrong one. Keep the key and values in sync with composables/useTheme.js.
    try {
      var saved = localStorage.getItem('theme')
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
