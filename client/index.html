<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover enables env(safe-area-inset-*) on notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Tells the browser both schemes are supported before CSS loads -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Factory Inventory Management System</title>
  <script>
    // Apply a saved theme before first paint so the page never flashes the
    // wrong one. Keep the key and values in sync with composables/useTheme.js.
    // data-theme = the user's explicit choice (absent = follow the OS).
    // data-scheme = the scheme actually showing, so styles that differ by more
    // than color (the dark "terminal" skin) need one selector, not two.
    // Storage gets its own try: blocked site data must still fall through to the
    // OS check below, or a system-dark user would flash light then terminal.
    var saved = null
    try { saved = localStorage.getItem('theme') } catch (e) {}
    try {
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.scheme = dark ? 'dark' : 'light'
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
